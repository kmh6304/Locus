
workflows:
  locus-ios:
    name: Locus iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Build Locus for iOS
        script: |
          set -e

          APP_OUTPUT_DIR="$PWD/build/DerivedData/Build/Products/Release-iphoneos"
          mkdir -p "$APP_OUTPUT_DIR"
          rm -rf "$APP_OUTPUT_DIR/Locus.app"

          xcodebuild \
            -project Locus.xcodeproj \
            -target Locus \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$APP_OUTPUT_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package and verify unsigned IPA
        script: |
          set -e

          APP_PATH="$PWD/build/DerivedData/Build/Products/Release-iphoneos/Locus.app"
          IPA_PATH="$PWD/build/ipa/Locus.ipa"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Locus.app was not generated."
            exit 1
          fi

          rm -rf "$PWD/Payload" "$PWD/build/ipa"
          mkdir -p "$PWD/Payload" "$PWD/build/ipa"
          cp -R "$APP_PATH" "$PWD/Payload/"

          cd "$PWD"
          zip -qry "$IPA_PATH" Payload

          if ! unzip -Z1 "$IPA_PATH" | grep -Fxq 'Payload/Locus.app/Info.plist'; then
            echo "ERROR: IPA Info.plist missing."
            exit 1
          fi

          if ! unzip -Z1 "$IPA_PATH" | grep -Fxq 'Payload/Locus.app/Locus'; then
            echo "ERROR: Locus executable missing."
            exit 1
          fi

          echo "IPA packaging verified: Payload/Locus.app is present."

    artifacts:
      - build/ipa/*.ipa
