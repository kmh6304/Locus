
workflows:
  locus-ios:
    name: Locus iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Build Locus for iOS
        script: |
          mkdir -p "$PWD/build/DerivedData/Build/Products/Release-iphoneos"
          rm -rf "$PWD/build/DerivedData/Build/Products/Release-iphoneos/Locus.app"

          xcodebuild \
            -project Locus.xcodeproj \
            -target Locus \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/DerivedData/Build/Products/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        script: |
          rm -rf Payload build/ipa
          mkdir -p build/ipa
          mkdir -p Payload

          test -d build/DerivedData/Build/Products/Release-iphoneos/Locus.app || {
            echo "ERROR: Locus.app was not generated."
            exit 1
          }

          cp -R build/DerivedData/Build/Products/Release-iphoneos/Locus.app Payload/

          cd Payload
          zip -r ../build/ipa/Locus.ipa Locus.app
          cd ..

    artifacts:
      - build/ipa/*.ipa
