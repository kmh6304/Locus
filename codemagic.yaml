
workflows:
  locus-ios:
    name: Locus iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Build Locus for iOS
        script: |
          set -e

          mkdir -p "$PWD/build/DerivedData/Build/Products/Release-iphoneos"
          rm -rf "$PWD/build/DerivedData/Build/Products/Release-iphoneos/Locus.app"

          xcodebuild \
            -project Locus.xcodeproj \
            -target Locus \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/DerivedData/Build/Products/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        script: |
          set -e

          rm -rf Payload build/ipa
          mkdir -p build/ipa
          mkdir -p Payload

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Locus.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Locus.app was not generated."
            exit 1
          fi

          cp -R "$APP_PATH" Payload/

          zip -r build/ipa/Locus.ipa Payload

          unzip -l build/ipa/Locus.ipa | grep "Payload/Locus.app/Info.plist"

          echo "IPA packaging verified."

    artifacts:
      - build/ipa/*.ipa
